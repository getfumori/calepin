name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Go service and Web client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install the locked pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Go vet and tests
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

      - name: Typecheck and test the Web client
        run: |
          pnpm run typecheck
          pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the binary and run end-to-end checks
        run: pnpm run test:e2e
