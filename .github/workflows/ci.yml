name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install the locked pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck the Web client and tests
        run: pnpm run typecheck

      - name: Run Web client tests
        run: pnpm test

      - name: Build the Web client
        run: pnpm run build
